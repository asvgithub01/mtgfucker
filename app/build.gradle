apply plugin: 'com.android.application'

android {
    compileSdkVersion 33


    defaultConfig {
        applicationId "io.asv.mtgocr.ocrreader"
        minSdkVersion 11
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
	//noinspection GradleCompatible
	implementation 'com.android.support:support-v4:23.0.1'
    //noinspection GradleDynamicVersion
    implementation 'com.google.android.gms:play-services-vision:9.4.0+'
    //noinspection GradleCompatible
    implementation 'com.android.support:design:23.0.1'
    implementation 'com.koushikdutta.ion:ion:2.1.8'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    //new ui
    //noinspection GradleCompatible
    implementation 'com.android.support:recyclerview-v7:23.0.0'
    //noinspection GradleCompatible
    implementation 'com.android.support:cardview-v7:23.0.0'
}
