apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// Keep local/unit-test builds usable before a Firebase project is attached. Once the
// downloaded file is placed in app/google-services.json, the normal Firebase resource
// generation (including default_web_client_id) is enabled automatically.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('Firebase cloud sync disabled: app/google-services.json is missing')
}

android {
    namespace 'io.asv.mtgocr.ocrreader'
    compileSdkVersion 34

    kotlin {
        jvmToolchain(17)
    }

    defaultConfig {
        applicationId "io.asv.mtgocr.ocrreader"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 2
        versionName "2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    lint {
        // Glide exposes an optional NotificationTarget, but this app never posts notifications.
        disable 'NotificationPermission'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation project(':liquid-glass')
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    // The existing camera bridge still uses the Vision Detector/Frame abstractions.
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    // Both scripts are bundled so the maintained scanner can choose one immediately and offline.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'

    implementation 'com.koushikdutta.ion:ion:2.2.1'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.moshi:moshi:1.15.0'
    implementation 'com.caverock:androidsvg-aar:1.4'

    implementation 'androidx.room:room-runtime:2.5.2'
    implementation 'androidx.room:room-ktx:2.5.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    kapt 'androidx.room:room-compiler:2.5.2'

    // This Firebase line remains compatible with the app's Kotlin 1.9/AGP 8.2 toolchain.
    // Newer Auth artifacts publish Kotlin 2.x metadata and require a wider toolchain migration.
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    testImplementation 'junit:junit:4.13.2'
}

// Room's verifier loads a native SQLite DLL during kapt. Gradle workers launched by the
// desktop host may otherwise inherit C:\WINDOWS as their temp directory, which is not writable.
def roomKaptTempDir = file("$buildDir/tmp/room-kapt")
roomKaptTempDir.mkdirs()
tasks.withType(org.jetbrains.kotlin.gradle.internal.KaptWithoutKotlincTask).configureEach {
    kaptProcessJvmArgs.add("-Djava.io.tmpdir=${roomKaptTempDir.absolutePath}")
    kaptProcessJvmArgs.add("-Dorg.sqlite.tmpdir=${roomKaptTempDir.absolutePath}")
    doFirst {
        // A combined `clean assemble` removes app/build after configuration time.
        roomKaptTempDir.mkdirs()
    }
}
